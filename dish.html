    <style>
        /* ========== DISH — photo-led detail page ========== */
        .dish-page .app { max-width: var(--wide); margin: 0 auto; padding-bottom: calc(112px + var(--safe-b)); }

        .dish-nav {
            position: sticky; top: 0; z-index: 100;
            background: var(--glass);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border-bottom: 1px solid var(--line);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .dish-nav-inner {
            max-width: var(--wide); margin: 0 auto;
            display: flex; align-items: center; gap: 10px;
            padding: calc(0.6rem + env(safe-area-inset-top, 0px)) 1rem 0.6rem;
        }
        .nav-title {
            flex: 1; min-width: 0; text-align: center;
            font-family: var(--font-display); font-size: 1.02rem; font-weight: 800; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        /* Phones: nav floats over the photo until the page scrolls */
        @media (max-width: 899px) {
            .dish-nav:not(.is-scrolled) { background: transparent; border-bottom-color: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
            .dish-nav:not(.is-scrolled) .nav-title { opacity: 0; transform: translateY(6px); }
            .dish-nav:not(.is-scrolled) .icon-btn {
                background: rgba(0, 0, 0, 0.35); border-color: rgba(255, 255, 255, 0.22); color: #fff; box-shadow: none;
                backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            }
            .dish-hero-wrap { margin-top: calc(-62px - env(safe-area-inset-top, 0px)); }
        }

        .dish-hero-wrap { position: relative; overflow: hidden; height: min(62vh, 112vw); background: var(--surface-3); }
        .dish-hero-wrap::after {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(180deg, rgba(0,0,0,0.45), rgba(0,0,0,0) 26%, rgba(0,0,0,0) 72%, rgba(0,0,0,0.22));
        }
        .dish-hero {
            width: 100%; height: 100%; object-fit: cover;
            transform: translate3d(0, calc(var(--sy, 0) * 0.35px), 0) scale(1.04);
            animation: heroIn 1.3s var(--ease-out) backwards;
        }
        @keyframes heroIn { from { opacity: 0; transform: scale(1.2); } }

        .dish-content {
            position: relative; z-index: 1;
            margin-top: -30px; padding: 22px 16px 10px;
            border-radius: 30px 30px 0 0;
            background: var(--bg);
            animation: sheetUp 0.9s var(--ease-out) 0.1s both;
        }
        .dish-content::before { content: ''; display: block; width: 40px; height: 4px; border-radius: 4px; background: var(--line-2); margin: -10px auto 16px; }
        @keyframes sheetUp { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: none; } }

        @media (min-width: 900px) {
            .dish-page .app { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); column-gap: 44px; padding-left: 24px; padding-right: 24px; }
            .dish-nav { grid-column: 1 / -1; margin: 0 -24px; }
            .dish-hero-wrap { position: sticky; top: 92px; align-self: start; height: calc(100vh - 130px); max-height: 640px; margin-top: 24px; border-radius: 30px; box-shadow: var(--shadow-lg); }
            .dish-hero { transform: none; }
            .dish-content { margin-top: 0; padding: 30px 0; border-radius: 0; background: transparent; }
            .dish-content::before { display: none; }
        }

        .hotel-badge {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; margin-bottom: 14px;
            border-radius: 18px;
            background: var(--surface); border: 1px solid var(--line);
            box-shadow: var(--shadow-sm);
        }
        .hotel-badge-icon { width: 40px; height: 40px; border-radius: 12px; object-fit: cover; }
        .hotel-badge-name { font-size: 0.9rem; font-weight: 800; color: var(--text); }
        .hotel-badge-sub { font-size: 0.7rem; font-weight: 600; color: var(--text-3); }
        .hotel-badge-type { margin-left: auto; font-size: 0.62rem; font-weight: 900; letter-spacing: 0.05em; padding: 4px 8px; border-radius: 8px; white-space: nowrap; }
        .hotel-badge-type.veg { color: var(--veg); background: var(--ok-soft); }
        .hotel-badge-type.nonveg { color: var(--nonveg); background: var(--danger-soft); }

        .dish-tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .tag-veg, .tag-nonveg, .tag-new, .tag-rating { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 99px; font-size: 0.68rem; font-weight: 800; }
        .tag-veg { color: var(--veg); background: var(--ok-soft); }
        .tag-nonveg { color: var(--nonveg); background: var(--danger-soft); }
        .tag-new { color: #fff; background: var(--grad-hot); letter-spacing: 0.06em; }
        .tag-rating { color: var(--text); background: var(--surface); border: 1px solid var(--line); }

        .dish-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
        .dish-title { font-family: var(--font-display); font-size: clamp(1.75rem, 7.4vw, 2.5rem); font-weight: 900; line-height: 1.06; letter-spacing: -0.03em; color: var(--text); }
        .share-btn {
            width: 44px; height: 44px; flex-shrink: 0;
            display: grid; place-items: center;
            border-radius: 14px;
            background: var(--surface); border: 1px solid var(--line);
            color: var(--text); box-shadow: var(--shadow-sm);
            transition: transform 0.2s var(--ease-spring);
        }
        .share-btn:active { transform: scale(0.9); }
        .dish-subtitle { font-size: 0.84rem; line-height: 1.5; color: var(--text-2); margin: 8px 0 14px; }

        .price-block { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
        .p-now { font-family: var(--font-display); font-size: 2.1rem; font-weight: 900; letter-spacing: -0.02em; color: var(--text); }
        .p-old { order: 1; font-size: 0.98rem; color: var(--text-3); text-decoration: line-through; }
        .p-off { order: 2; padding: 5px 9px; border-radius: 9px; background: var(--grad-hot); color: #fff; font-size: 0.72rem; font-weight: 900; letter-spacing: 0.03em; }

        .section-title { font-size: 0.72rem; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }
        .includes-card { padding: 4px 14px; margin-bottom: 24px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
        .include-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px dashed var(--line-2); animation: rise 0.6s var(--ease-out) both; }
        .include-item:last-child { border-bottom: 0; }
        .include-item:nth-child(1) { animation-delay: 0.25s; }
        .include-item:nth-child(2) { animation-delay: 0.32s; }
        .include-item:nth-child(3) { animation-delay: 0.39s; }
        .include-item:nth-child(4) { animation-delay: 0.46s; }
        .include-item:nth-child(5) { animation-delay: 0.53s; }
        .include-item:nth-child(6) { animation-delay: 0.6s; }
        .include-item:nth-child(n+7) { animation-delay: 0.67s; }
        .include-emoji { width: 42px; height: 42px; border-radius: 14px; flex-shrink: 0; display: grid; place-items: center; font-size: 1.3rem; background: var(--surface-2); }
        .include-text { font-size: 0.92rem; font-weight: 800; color: var(--text); }
        .include-sub { font-size: 0.75rem; color: var(--text-3); margin-top: 1px; }
        .divider { display: none; }

        .review-carousel-wrap { position: relative; overflow: hidden; margin-bottom: 10px; }
        .review-carousel { display: flex; transition: transform 0.6s var(--ease-out); }
        .review-slide { min-width: 100%; padding: 0 2px; }
        .review-card { padding: 16px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
        .review-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .review-avatar { width: 38px; height: 38px; border-radius: 13px; flex-shrink: 0; display: grid; place-items: center; background: var(--grad-brand); color: #fff; font-size: 0.8rem; font-weight: 800; }
        .review-name { font-size: 0.88rem; font-weight: 800; color: var(--text); }
        .review-date { font-size: 0.7rem; color: var(--text-3); }
        .review-stars { font-size: 0.72rem; margin-bottom: 6px; }
        .review-text { font-size: 0.86rem; line-height: 1.55; color: var(--text-2); }
        .review-dots { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
        .review-dot { width: 7px; height: 7px; border-radius: 99px; background: var(--line-2); cursor: pointer; transition: all 0.35s var(--ease-out); }
        .review-dot.active { width: 22px; background: var(--brand); }

        /* Floating add-to-cart bar */
        .order-bar {
            position: fixed; z-index: 100;
            left: 12px; right: 12px; bottom: calc(12px + var(--safe-b));
            max-width: 560px; margin: 0 auto;
            padding: 10px 10px 10px 18px;
            border-radius: 22px;
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--line);
            box-shadow: var(--shadow-lg);
            animation: barIn 0.8s var(--ease-spring) 0.45s both;
        }
        @keyframes barIn { from { opacity: 0; transform: translateY(70px); } to { opacity: 1; transform: none; } }
        .order-bar-inner { display: flex; align-items: center; gap: 12px; }
        .ob-price { flex: 1; display: flex; flex-direction: column; }
        .ob-price-now { font-family: var(--font-display); font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; color: var(--text); }
        .ob-price-old { font-size: 0.78rem; color: var(--text-3); text-decoration: line-through; }
        .ob-btn {
            position: relative; overflow: hidden;
            display: flex; align-items: center; gap: 6px;
            height: 52px; padding: 0 22px;
            border: 0; border-radius: 16px;
            background: var(--grad-brand); color: #fff;
            font-size: 0.96rem; font-weight: 800;
            box-shadow: var(--shadow-brand);
            transition: transform 0.2s var(--ease-spring);
        }
        .ob-btn:active { transform: scale(0.96); }

        /* Bottom sheet: added + suggestions */
        .bs-overlay { position: fixed; inset: 0; z-index: 200; background: var(--scrim); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
        .bs-overlay.show { opacity: 1; pointer-events: auto; }
        .bs-sheet {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 201;
            max-width: 640px; max-height: 86vh; margin: 0 auto; overflow-y: auto;
            padding-bottom: var(--safe-b);
            border-radius: 30px 30px 0 0;
            background: var(--surface);
            box-shadow: var(--shadow-lg);
            transform: translateY(105%);
            transition: transform 0.6s var(--ease-out);
        }
        .bs-sheet.show { transform: none; }
        .bs-handle { width: 44px; height: 5px; border-radius: 5px; background: var(--line-2); margin: 10px auto 0; }
        .bs-inner { padding: 14px 16px 20px; }
        .added-confirm { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 16px; border-radius: 18px; background: var(--brand-soft); }
        .added-check { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; background: var(--surface); font-size: 1.2rem; box-shadow: var(--shadow-sm); }
        .bs-sheet.show .added-check { animation: pop 0.6s var(--ease-spring) 0.2s both; }
        .added-info { flex: 1; }
        .added-name { font-size: 0.92rem; font-weight: 800; color: var(--brand-ink); }
        .added-sub { font-size: 0.76rem; color: var(--text-2); }
        .sug-title { font-size: 0.72rem; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }
        .sug-scroll { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 16px; padding: 2px 16px 8px; }
        .sug-scroll::-webkit-scrollbar { display: none; }
        .sug-card { flex-shrink: 0; width: 150px; overflow: hidden; border-radius: 18px; background: var(--surface-2); border: 1.5px solid var(--line); cursor: pointer; transition: transform 0.2s var(--ease-spring), border-color 0.2s ease; }
        .sug-card.in-cart { border-color: var(--brand); }
        .sug-img { width: 100%; height: 96px; object-fit: cover; }
        .sug-body { padding: 8px 10px 10px; }
        .sug-name { font-size: 0.8rem; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sug-desc { font-size: 0.66rem; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 2px 0 4px; }
        .sug-price-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
        .sug-price { font-size: 0.86rem; font-weight: 800; color: var(--text); }
        .sug-old { font-size: 0.68rem; color: var(--text-3); text-decoration: line-through; }
        .sug-add-btn { position: relative; overflow: hidden; width: 100%; height: 34px; border-radius: 10px; background: var(--grad-brand); border: 0; color: #fff; font-size: 0.74rem; font-weight: 900; letter-spacing: 0.04em; box-shadow: 0 6px 16px rgba(241, 90, 10, 0.3); }
        .sug-add-btn.added { background: var(--brand-soft); color: var(--brand-ink); box-shadow: none; }
        .bs-cart-summary { display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin-bottom: 12px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); }
        .bs-cart-count { font-size: 0.86rem; font-weight: 800; color: var(--text); }
        .bs-cart-total { margin-left: auto; font-family: var(--font-display); font-size: 1.15rem; font-weight: 900; color: var(--text); }
        .bs-go-cart {
            position: relative; overflow: hidden;
            width: 100%; height: 54px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            border: 0; border-radius: 16px;
            background: var(--grad-brand); color: #fff;
            font-size: 0.98rem; font-weight: 800;
            box-shadow: var(--shadow-brand);
        }

        /* Closed notice */
        .closed-overlay {
            display: none; position: fixed; inset: 0; z-index: 9999;
            padding: 24px; align-items: center; justify-content: center; text-align: center;
            background: var(--scrim);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        }
        .closed-overlay.show { display: flex; animation: fadeIn 0.3s ease; }
        .closed-card { width: 100%; max-width: 360px; padding: 28px 22px 22px; border-radius: 28px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-lg); animation: rise 0.55s var(--ease-spring); }
        .closed-icon { display: inline-block; font-size: 3.4rem; margin-bottom: 10px; animation: pulse-clock 2s ease-in-out infinite; }
        @keyframes pulse-clock { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .closed-title { font-family: var(--font-display); font-size: 1.4rem; font-weight: 900; color: var(--text); margin-bottom: 6px; }
        .closed-subtitle { font-size: 0.86rem; line-height: 1.5; color: var(--text-2); }
        .closed-time { display: inline-block; margin: 14px 0 6px; padding: 8px 16px; border-radius: 12px; background: var(--brand-soft); color: var(--brand-ink); font-size: 0.95rem; font-weight: 800; }
        .closed-tomorrow { font-size: 0.8rem; color: var(--text-3); margin-bottom: 18px; }
        .closed-dismiss { width: 100%; height: 50px; border: 0; border-radius: 15px; background: var(--grad-brand); color: #fff; font-size: 0.95rem; font-weight: 800; box-shadow: var(--shadow-brand); }
        /* Line icons instead of emoji */
        .section-title .ic, .sug-title .ic { width: 15px; height: 15px; color: var(--brand); vertical-align: -3px; margin-right: 2px; }
        .include-emoji { background: var(--brand-soft); }
        .include-emoji .ic { width: 20px; height: 20px; color: var(--brand); }
        .include-item:nth-child(3n+2) .include-emoji { background: var(--ok-soft); }
        .include-item:nth-child(3n+2) .include-emoji .ic { color: var(--ok); }
        .include-item:nth-child(3n) .include-emoji { background: var(--warn-soft); }
        .include-item:nth-child(3n) .include-emoji .ic { color: var(--warn); }
        .tag-veg::before, .tag-nonveg::before, .hotel-badge-type::before { content: ''; width: 12px; height: 12px; flex-shrink: 0; background: var(--mark-veg) center/contain no-repeat; }
        .tag-nonveg::before, .hotel-badge-type.nonveg::before { background-image: var(--mark-nonveg); }
        .hotel-badge-type { display: inline-flex; align-items: center; gap: 5px; }
        .tag-rating .ic { width: 13px; height: 13px; }
        .review-stars.stars { display: block; margin-bottom: 8px; }
        .added-check .ic { width: 22px; height: 22px; color: var(--brand); stroke-width: 3; }
        .bs-cart-count .ic, .bs-go-cart .ic { width: 18px; height: 18px; vertical-align: -3px; }
        .closed-icon .ic { width: 58px; height: 58px; color: var(--brand); }
    </style>
    <script src="theme.js?v=1"></script>
    <script src="navratri.js?v=7"></script>
    <script src="i18n.js"></script>

<body class="dish-page">
    <div class="app">
        <!-- Nav: floats over the photo on phones -->
        <nav class="dish-nav" data-scroll-header>
            <div class="dish-nav-inner">
                <button class="icon-btn back-btn" onclick="if (document.referrer.indexOf(location.origin) === 0) { history.back(); } else { location.href = 'index.html'; }" aria-label="Go back">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <span class="nav-title" id="navTitle">Loading...</span>
                <a href="order.html" class="icon-btn" aria-label="Go to cart"><i class="ic" data-ic="cart"></i></a>
            </div>
        </nav>

        <!-- Hero Image -->
        <div class="dish-hero-wrap" data-parallax>
            <img src="" alt="" class="dish-hero" id="dishHero">
        </div>

        <div class="dish-content">
            <!-- Hotel Badge -->
            <div class="hotel-badge" id="hotelBadge"></div>

            <!-- Tags -->
            <div class="dish-tags" id="dishTags"></div>

            <!-- Title & Share -->
            <div class="dish-title-row">
                <h1 class="dish-title" id="dishTitle">Loading...</h1>
                <button class="share-btn" onclick="shareDish()" title="Share" aria-label="Share this dish">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                </button>
            </div>
            <p class="dish-subtitle" id="dishSubtitle"></p>

            <!-- Price -->
            <div class="price-block">
                <span class="p-old" id="pOld"></span>
                <span class="p-now" id="pNow"></span>
                <span class="p-off" id="pOff"></span>
            </div>

            <!-- What's Included -->
            <div class="section-title"><i class="ic" data-ic="bowl"></i> What's Included</div>
            <div class="includes-card" id="includesCard"></div>

            <div class="divider"></div>

            <!-- Customer Reviews (Rotating Carousel) -->
            <div class="section-title"><i class="ic" data-ic="star"></i> Customer Reviews</div>
            <div class="review-carousel-wrap">
                <div class="review-carousel" id="reviewCarousel"></div>
                <div class="review-dots" id="reviewDots"></div>
            </div>
        </div>
    </div>

    <!-- Fixed Order Button -->
    <div class="order-bar" id="orderBar">
        <div class="order-bar-inner">
            <div class="ob-price">
                <span class="ob-price-now" id="obPrice"></span>
                <span class="ob-price-old" id="obOldPrice"></span>
            </div>

    <script>
    // --- Shop Status ---
    const API_URL = 'https://f37z1y2xbg.execute-api.ap-south-1.amazonaws.com';
    let SHOP_OPEN = null;
    let SHOP_MESSAGE = '';
    let SHOP_OPEN_TIME = '10:00';
    let SHOP_CLOSE_TIME = '21:40';
    let shopStatusLoaded = false;
    let currentDishData = null;

    function isWithinHoursLocally() {
        const now = new Date();
        const istOffset = 5.5 * 60 * 60 * 1000;
        const istNow = new Date(now.getTime() + istOffset + now.getTimezoneOffset() * 60000);
        const nowMinutes = istNow.getHours() * 60 + istNow.getMinutes();
        const [oh, om] = SHOP_OPEN_TIME.split(':').map(Number);
        const [ch, cm] = SHOP_CLOSE_TIME.split(':').map(Number);
        const openMin = oh * 60 + om;
        const closeMin = ch * 60 + cm;
        if (closeMin > openMin) {
            return nowMinutes >= openMin && nowMinutes < closeMin;
        } else {
            return nowMinutes >= openMin || nowMinutes < closeMin;
        }
    }

    async function fetchShopStatus() {
        try {
            const res = await fetch(API_URL + '/shop-status');
            const data = await res.json();
            if (data && data.success !== undefined) {
                SHOP_OPEN = !!data.isOpen;
                SHOP_MESSAGE = data.message || '';
                SHOP_OPEN_TIME = data.openTime || '10:00';
                SHOP_CLOSE_TIME = data.closeTime || '21:40';
                shopStatusLoaded = true;
            }
        } catch (e) {
            SHOP_OPEN = isWithinHoursLocally();
            if (!SHOP_OPEN) {
                SHOP_MESSAGE = 'We are closed. Orders open at ' + SHOP_OPEN_TIME + '.';
            }
            shopStatusLoaded = true;
        }
        // HARD FAILSAFE: Always enforce client-side time (10 AM - 10 PM)
        if (!isWithinHoursLocally()) {
            SHOP_OPEN = false;
            SHOP_MESSAGE = SHOP_MESSAGE || 'We are closed. Orders open at 10:00 AM.';
        }
    }

    fetchShopStatus();

    function isShopOpen() {
        if (shopStatusLoaded && SHOP_OPEN !== null) return SHOP_OPEN;
        return isWithinHoursLocally();
    }

    // Check if current dish is Shriyan Chinese and if Chinese hours apply
    function isChineseOpenLocal() {
        const now = new Date();
        const hour = now.getHours();
        return hour >= 15 && hour < 22;
    }

    // Mauli Veg Rol: only 5 PM - 10 PM
    function isRollsOpenLocal() {
        const now = new Date();
        const hour = now.getHours();
        return hour >= 17 && hour < 22;
    }

    async function shareDish() {
        if (!currentDishData) return;
        const url = window.location.href;
        const title = `Try ${currentDishData.name} at Aapla Swad!`;
        const text = `I found this amazing ${currentDishData.name} for just ₹${currentDishData.price}. Order now from Aapla Swad!`;
        
        if (navigator.share) {
            try {
                await navigator.share({ title, text, url });
            } catch (err) {
                console.log('Error sharing:', err);
            }
        } else {
            navigator.clipboard.writeText(`${title} - ${url}`);
            const btn = document.querySelector('.share-btn');
            const oldHTML = btn.innerHTML;
            btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
            setTimeout(() => { btn.innerHTML = oldHTML; }, 2000);
        }
    }

    // Line icon for each thing on the plate (the emoji in MENU stay as data only)
    function includeIcon(name) {
        const n = name.toLowerCase();
        if (/chil|thecha|spicy|schezwan/.test(n)) return 'flame';
        if (/ghee|sauce|dip|pickle|aachar|lonch|chutney|chatni/.test(n)) return 'droplet';
        if (/sweet|churma|ladoo/.test(n)) return 'sparkles';
        if (/batti|bati|bhakri|bhakar|bhakari|chapati|roll|coating|bread/.test(n)) return 'wheat';
        if (/onion|lemon|limbu|kanda|veg|pepper|capsicum|salad/.test(n)) return 'leaf';
        return 'bowl';
    }

    function renderDish() {
        const isVeg = dish.category === 'veg';
        const hotelName = dish.hotel || (dish.image && dish.image.includes('vegcurry') ? 'Hotel Sahyadri' : (isVeg ? 'Aapla Swad Hotel' : 'Hotel Sahyadri'));

        const hotelLogoMap = { 'Indiano Food Junction': 'assets/burger/indiano-logo.png' };

        // Tags
        let tagsHTML = `<span class="${isVeg ? 'tag-veg' : 'tag-nonveg'}">${isVeg ? 'VEG' : 'NON-VEG'}</span>`;
        tagsHTML += `<span class="tag-rating"><i class="ic" data-ic="star"></i> ${isVeg ? '4.9' : '4.8'} · ${dish.reviews.length} review${dish.reviews.length === 1 ? '' : 's'}</span>`;
        if (itemKey !== 'dal-bati') tagsHTML += '<span class="tag-new">NEW</span>';
        document.getElementById('dishTags').innerHTML = tagsHTML;

        // Title
        document.getElementById('dishTitle').textContent = dish.name;
        document.getElementById('dishSubtitle').textContent = hotelName + ' • ' + hotelSub + ' • Served hot & fresh';

        // Price
        document.getElementById('pOld').textContent = '₹' + dish.oldPrice;
        document.getElementById('pNow').textContent = '₹' + dish.price;
        document.getElementById('pOff').textContent = dish.discount;
        document.getElementById('obPrice').textContent = '₹' + dish.price;
        document.getElementById('obOldPrice').textContent = '₹' + dish.oldPrice;

        // Includes
        let incHTML = '';
        dish.includesList.forEach(inc => {
            incHTML += `
            <div class="include-item">
                <span class="include-emoji"><i class="ic" data-ic="${includeIcon(inc.name)}"></i></span>
                <div>
                    <div class="include-text">${inc.name}</div>

            </div>`;
        });
        document.getElementById('includesCard').innerHTML = incHTML;

        // Reviews Carousel
        let carouselHTML = '';
        let dotsHTML = '';
        dish.reviews.forEach((rev, i) => {
            const initials = rev.name.split(' ').map(w => w[0]).join('');
            carouselHTML += `
            <div class="review-slide">
                <div class="review-card">
                    <div class="review-header">
                        <div class="review-avatar">${initials}</div>

                    <div class="review-text">"${rev.text}"</div>
                </div>
            </div>`;
            dotsHTML += `<div class="review-dot ${i === 0 ? 'active' : ''}" onclick="goToReview(${i})"></div>`;
        });
        document.getElementById('reviewCarousel').innerHTML = carouselHTML;
        document.getElementById('reviewDots').innerHTML = dotsHTML;

        // Start auto-rotation
        startReviewCarousel();
    }

    // --- Review Carousel Logic ---
    function goToReview(index) {
        const carousel = document.getElementById('reviewCarousel');
        const dots = document.querySelectorAll('.review-dot');
        const total = dish.reviews.length;
        currentReview = index % total;
        carousel.style.transform = `translateX(-${currentReview * 100}%)`;
        dots.forEach((d, i) => d.classList.toggle('active', i === currentReview));
    }

    function startReviewCarousel() {
        if (reviewInterval) clearInterval(reviewInterval);
        reviewInterval = setInterval(() => {
            goToReview(currentReview + 1);
        }, 3500);
    }

    // Pause on touch
    // Prices and availability come from the admin panel. The descriptions and
    // reviews above are page content the API does not hold, so only the live
    // fields are overlaid onto them.
    async function applyLivePricing() {
        try {
            const res = await fetch('https://f37z1y2xbg.execute-api.ap-south-1.amazonaws.com/menu');
            const data = await res.json();
            if (!data || !data.success || !data.menu) return;

            let changed = false;
            Object.keys(MENU).forEach(key => {
                const live = data.menu[key];
                if (!live) return;
                ['price', 'oldPrice', 'discount', 'name', 'shortName'].forEach(field => {
                    if (live[field] !== undefined && live[field] !== MENU[key][field]) {
                        MENU[key][field] = live[field];
                        changed = true;
                    }
                });
                MENU[key].available = live.available !== false;
                if (live.available === false) changed = true;
            });

            if (changed) renderDish();
        } catch (err) {
            // Offline: the built-in prices stay on screen, and the order page
            // re-checks against the server before anything is charged.
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        applyLivePricing();

        const wrap = document.querySelector('.review-carousel-wrap');
        if (wrap) {
            wrap.addEventListener('touchstart', () => { if (reviewInterval) clearInterval(reviewInterval); });
            wrap.addEventListener('touchend', () => { startReviewCarousel(); });
        }
    });

                        <span class="sug-old">₹${m.oldPrice}</span>
                    </div>
                    <button class="sug-add-btn ${inCart ? 'added' : ''}" id="sug-btn-${key}" onclick="addSuggestion('${key}')">
                        ${inCart ? '✓ Added' : '+ ADD'}
                    </button>
                </div>
            </div>`;
        });
        sugScroll.innerHTML = sugHTML;

        // Update cart summary
        updateCartSummary();

        // Change bottom bar button
        const obBtn = document.getElementById('obBtn');
        obBtn.innerHTML = '✓ Added — View Cart';
        obBtn.onclick = goToCart;
        obBtn.style.background = 'linear-gradient(135deg, #ff7a18, #c2410c)';

        // Show sheet
        document.getElementById('bsOverlay').classList.add('show');
        document.getElementById('bsSheet').classList.add('show');
    }

    function addSuggestion(key) {
        preCart[key] = (preCart[key] || 0) + 1;
        localStorage.setItem('sp_precart', JSON.stringify(preCart));

        // Update button
        const btn = document.getElementById('sug-btn-' + key);
        btn.textContent = '✓ Added';
        btn.classList.add('added');
        const card = document.getElementById('sug-card-' + key);
        card.classList.add('in-cart');

        // Quick animation
        card.style.transform = 'scale(0.95)';
        setTimeout(() => { card.style.transform = 'scale(1)'; }, 150);

        updateCartSummary();
    }

    function updateCartSummary() {
        let totalItems = 0;
        let totalPrice = 0;
        Object.keys(preCart).forEach(key => {
            if (preCart[key] > 0 && MENU[key]) {
                totalItems += preCart[key];
                totalPrice += preCart[key] * MENU[key].price;
            }
        });

        const itemNames = Object.keys(preCart)
            .filter(k => preCart[k] > 0 && MENU[k])
            .map(k => `${MENU[k].shortName} ×${preCart[k]}`)
            .join(', ');

        document.getElementById('bsCartSummary').innerHTML = `
            <div>
                <div class="bs-cart-count"><i class="ic" data-ic="cart"></i> ${totalItems} item${totalItems > 1 ? 's' : ''}</div>
                <div style="font-size:0.52rem;color:#888;">${itemNames}</div>
            </div>
            <span class="bs-cart-total">₹${totalPrice}</span>
        `;
    }

    function closeSuggestions() {
        document.getElementById('bsOverlay').classList.remove('show');
        document.getElementById('bsSheet').classList.remove('show');
    }

    function goToCart() {
        localStorage.setItem('sp_precart', JSON.stringify(preCart));
        window.location.href = 'order.html';
    }
    </script>
</body>
</html>
