    <style>
        :root { --orange:#ea580c; --gold:#f59e0b; --bg:#0e0e0e; --card:#161616; --border:rgba(255,255,255,0.06); }

        .closed-time { font-size:1.1rem; font-weight:700; color:var(--gold); margin:0.8rem 0; background:rgba(245,158,11,0.1); padding:0.6rem 1.5rem; border-radius:12px; border:1px solid rgba(245,158,11,0.2); }

        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:#fafafa; font-family:'Manrope','Outfit',sans-serif; min-height:100dvh; }
        .app { max-width:480px; margin:0 auto; padding-bottom:80px; }

        /* Back nav */
        .dish-nav { position:sticky; top:0; z-index:100; background:rgba(14,14,14,0.92); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:1px solid var(--border); }
        .dish-nav-inner { max-width:480px; margin:0 auto; padding:0.7rem 1rem; display:flex; align-items:center; gap:0.6rem; }

        .tag-nonveg { font-size:0.58rem; color:#ef4444; background:rgba(239,68,68,0.1); padding:0.12rem 0.4rem; border-radius:5px; font-weight:600; }

        /* Name & Price */

        .review-dot.active { background:var(--gold); width:18px; border-radius:4px; }

        /* Order button (fixed) */
        .order-bar { position:fixed; bottom:0; left:0; right:0; background:rgba(14,14,14,0.95); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-top:1px solid var(--border); padding:0.6rem 1rem; z-index:100; }

        .ob-price-old { font-size:0.6rem; color:#666; text-decoration:line-through; margin-left:0.3rem; }
        .ob-btn { padding:0.7rem 1.5rem; background:linear-gradient(135deg, var(--orange), #c2410c); color:white; border:none; border-radius:12px; font-size:0.82rem; font-weight:700; cursor:pointer; font-family:inherit; transition:transform 0.15s; display:flex; align-items:center; gap:0.3rem; }
        .ob-btn:active { transform:scale(0.97); }

        /* Divider */
        .divider { height:6px; background:rgba(255,255,255,0.02); margin:0 -1rem 0.8rem; }

        /* Bottom Sheet Overlay */
        .bs-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:200; opacity:0; pointer-events:none; transition:opacity 0.3s; }
        .bs-overlay.show { opacity:1; pointer-events:auto; }
        .bs-sheet { position:fixed; bottom:0; left:0; right:0; z-index:201; background:#1a1a1a; border-radius:20px 20px 0 0; transform:translateY(100%); transition:transform 0.4s cubic-bezier(0.4,0,0.2,1); max-height:85vh; overflow-y:auto; }

        .bs-handle { width:36px; height:4px; background:rgba(255,255,255,0.15); border-radius:2px; margin:0.6rem auto 0; }
        .bs-inner { padding:0.8rem 1rem 1.2rem; max-width:480px; margin:0 auto; }

        /* Added confirmation */
        .added-confirm { display:flex; align-items:center; gap:0.5rem; padding:0.6rem 0.7rem; background:rgba(34,197,94,0.08); border:1px solid rgba(34,197,94,0.15); border-radius:12px; margin-bottom:0.7rem; }
        .added-check { width:36px; height:36px; border-radius:50%; background:rgba(34,197,94,0.15); display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex-shrink:0; }

        .added-name { font-size:0.78rem; font-weight:700; color:#22c55e; }
        .added-sub { font-size:0.58rem; color:#888; }

        /* Suggestions */
        .sug-title { font-size:0.68rem; font-weight:700; color:#9ca3af; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:0.4rem; }
        .sug-scroll { display:flex; gap:0.5rem; overflow-x:auto; padding-bottom:0.3rem; scrollbar-width:none; margin-bottom:0.7rem; }
        .sug-scroll::-webkit-scrollbar { display:none; }
        .sug-card { min-width:140px; max-width:160px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:12px; overflow:hidden; flex-shrink:0; cursor:pointer; transition:border-color 0.2s; }
        .sug-card:active { border-color:rgba(234,88,12,0.3); }
        .sug-card.in-cart { border-color:rgba(34,197,94,0.3); }
        .sug-img { width:100%; height:85px; object-fit:cover; }
        .sug-body { padding:0.4rem 0.5rem 0.5rem; }
        .sug-name { font-size:0.68rem; font-weight:700; color:#fafafa; margin-bottom:0.1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .sug-desc { font-size:0.5rem; color:#888; margin-bottom:0.2rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .sug-price-row { display:flex; align-items:center; gap:0.25rem; margin-bottom:0.3rem; }
        .sug-price { font-size:0.72rem; font-weight:800; color:var(--gold); }
        .sug-old { font-size:0.5rem; color:#666; text-decoration:line-through; }
        .sug-add-btn { width:100%; padding:0.3rem; background:rgba(234,88,12,0.1); border:1.5px solid rgba(234,88,12,0.25); color:#ea580c; border-radius:6px; font-size:0.62rem; font-weight:700; cursor:pointer; font-family:inherit; transition:all 0.15s; }
        .sug-add-btn:active { transform:scale(0.95); background:rgba(234,88,12,0.2); }
        .sug-add-btn.added { background:rgba(34,197,94,0.1); border-color:rgba(34,197,94,0.25); color:#22c55e; }

        /* Cart summary in sheet */
        .bs-cart-summary { display:flex; align-items:center; gap:0.5rem; padding:0.55rem 0.65rem; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:10px; margin-bottom:0.6rem; }
        .bs-cart-count { font-size:0.72rem; font-weight:700; color:#fafafa; }
        .bs-cart-total { font-size:0.82rem; font-weight:800; color:var(--gold); margin-left:auto; }
        .bs-go-cart { width:100%; padding:0.75rem; background:linear-gradient(135deg, var(--orange), #c2410c); color:white; border:none; border-radius:12px; font-size:0.85rem; font-weight:700; cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:0.4rem; transition:transform 0.15s; }
        .bs-go-cart:active { transform:scale(0.97); }
    </style>
    <script src="i18n.js"></script>
</head>
<body>

        <div class="closed-subtitle" id="closedMessage">We are closed right now. Please check back during opening hours.</div>
        <div class="closed-time" id="closedTime">🕐 Orders open at 10:00</div>
        <div class="closed-tomorrow">Please order tomorrow! 🙏</div>
        <button class="closed-dismiss" onclick="document.getElementById('closedOverlay').classList.remove('show')">OK, Got it</button>
    </div>

    <script>
    // --- Shop Status ---
    const API_URL = 'https://f37z1y2xbg.execute-api.ap-south-1.amazonaws.com';
    let SHOP_OPEN = null;
    let SHOP_MESSAGE = '';
    let SHOP_OPEN_TIME = '10:00';
    let SHOP_CLOSE_TIME = '21:40';
    let shopStatusLoaded = false;
    let currentDishData = null;

    function isWithinHoursLocally() {
        const now = new Date();
        const istOffset = 5.5 * 60 * 60 * 1000;
        const istNow = new Date(now.getTime() + istOffset + now.getTimezoneOffset() * 60000);
        const nowMinutes = istNow.getHours() * 60 + istNow.getMinutes();
        const [oh, om] = SHOP_OPEN_TIME.split(':').map(Number);
        const [ch, cm] = SHOP_CLOSE_TIME.split(':').map(Number);
        const openMin = oh * 60 + om;
        const closeMin = ch * 60 + cm;
        if (closeMin > openMin) {
            return nowMinutes >= openMin && nowMinutes < closeMin;
        } else {
            return nowMinutes >= openMin || nowMinutes < closeMin;
        }
    }

    async function fetchShopStatus() {
        try {
            const res = await fetch(API_URL + '/shop-status');
            const data = await res.json();
            if (data && data.success !== undefined) {
                SHOP_OPEN = !!data.isOpen;
                SHOP_MESSAGE = data.message || '';
                SHOP_OPEN_TIME = data.openTime || '10:00';
                SHOP_CLOSE_TIME = data.closeTime || '21:40';
                shopStatusLoaded = true;
            }
        } catch (e) {
            SHOP_OPEN = isWithinHoursLocally();
            if (!SHOP_OPEN) {
                SHOP_MESSAGE = 'We are closed. Orders open at ' + SHOP_OPEN_TIME + '.';
            }
            shopStatusLoaded = true;
        }
        // HARD FAILSAFE: Always enforce client-side time (10 AM - 10 PM)
        if (!isWithinHoursLocally()) {
            SHOP_OPEN = false;
            SHOP_MESSAGE = SHOP_MESSAGE || 'We are closed. Orders open at 10:00 AM.';
        }
    }

    fetchShopStatus();

    function isShopOpen() {
        if (shopStatusLoaded && SHOP_OPEN !== null) return SHOP_OPEN;
        return isWithinHoursLocally();
    }

    // Check if current dish is Shriyan Chinese and if Chinese hours apply
    function isChineseOpenLocal() {
        const now = new Date();
        const hour = now.getHours();
        return hour >= 15 && hour < 22;
    }

    // Mauli Veg Rol: only 5 PM - 10 PM
    function isRollsOpenLocal() {
        const now = new Date();
        const hour = now.getHours();
        return hour >= 17 && hour < 22;
    }

    function showClosedOverlay(customMsg, customTime) {
        const overlay = document.getElementById('closedOverlay');
        const msgEl = document.getElementById('closedMessage');
        const timeEl = document.getElementById('closedTime');
        if (msgEl) msgEl.textContent = customMsg || SHOP_MESSAGE || 'We are closed right now. Please check back during opening hours.';
        if (timeEl) timeEl.textContent = customTime || ('🕐 Orders open at ' + SHOP_OPEN_TIME);
        overlay.classList.add('show');
    }

    const MENU = {
        'dal-bati': {
            name: 'Normal Dal Batti', shortName: 'Dal Batti', price: 80, oldPrice: 150,
            discount: '47% OFF', image: 'hero.png', category: 'veg',
            includesList: [
                { emoji: '🫓', name: 'Batti (8 pcs)', desc: 'Crispy wood-fire baked dough balls' },
                { emoji: '🧅', name: 'Onion', desc: 'Fresh sliced raw onion' },
                { emoji: '🍋', name: 'Lemon', desc: 'Fresh lemon wedge' },
                { emoji: '🥘', name: 'Dal', desc: 'Rich spiced dal' },
                { emoji: '🌶️', name: 'Thecha', desc: 'Crushed green chili-garlic condiment' },
                { emoji: '🫙', name: 'Loncha', desc: 'Tangy homemade pickle' }
            ],
            reviews: [
                { name: 'Priya S.', stars: 5, text: 'Best dal bati I have ever had! Crispy bati with so much ghee. Reminds me of Rajasthan ❤️', date: '2 days ago' },

            includesList: [{ emoji: '🌯', name: '2 Rolls', desc: 'Freshly made crispy rolls' }, { emoji: '🥗', name: 'Veg + Noodles', desc: 'Mixed vegetables and noodles' }],
            reviews: [{ name: 'Deepak S.', stars: 4, text: 'Good portion and tasty combo!', date: '4 days ago' }]
        },
        'noodles-manchurian-mix-roll': {
            name: 'Noodles Manchurian Mix Roll (2 pcs)', shortName: 'Noodles Manchurian Roll', price: 139, oldPrice: 200,
            discount: '31% OFF', image: 'assets/rolls/noodles-manchurian-mix-roll.jpg', category: 'veg', hotel: 'Mauli Veg Rol',
            includesList: [{ emoji: '🌯', name: '2 Rolls', desc: 'Freshly made crispy rolls' }, { emoji: '🍜', name: 'Noodles + Manchurian', desc: 'Noodles and manchurian filling' }],
            reviews: [{ name: 'Suresh K.', stars: 5, text: 'Noodles + Manchurian inside a roll = heaven! 🤤', date: '1 day ago' }]
        },
        'paneer-noodles-mix-roll': {
            name: 'Paneer Noodles Mix Roll (2 pcs)', shortName: 'Paneer Noodles Roll', price: 144, oldPrice: 210,
            discount: '31% OFF', image: 'assets/rolls/paneer-noodles-mix-roll.jpg', category: 'veg', hotel: 'Mauli Veg Rol',
            includesList: [{ emoji: '🌯', name: '2 Rolls', desc: 'Freshly made crispy rolls' }, { emoji: '🧀', name: 'Paneer + Noodles', desc: 'Paneer and noodles mix filling' }],
            reviews: [{ name: 'Anita J.', stars: 5, text: 'Premium roll with paneer and noodles. Worth every rupee!', date: '2 days ago' }]
        }
    };

    const params = new URLSearchParams(window.location.search);
    const itemKey = params.get('item') || 'dal-bati';
    const dish = MENU[itemKey];
    currentDishData = dish;

    let currentReview = 0;
    let reviewInterval = null;
    let preCart = JSON.parse(localStorage.getItem('sp_precart') || '{}');

    if (!dish) {
        document.body.innerHTML = '<div style="text-align:center;padding:3rem;color:#888;">Item not found. <a href="index.html" style="color:#f59e0b;">Go back</a></div>';
    } else {
        (async () => {
            try {
                const res = await Promise.race([
                    fetch('https://f37z1y2xbg.execute-api.ap-south-1.amazonaws.com/menu'),
                    new Promise((_, rej) => setTimeout(() => rej('timeout'), 2000))
                ]);
                const data = await res.json();
                if (data && data.success && data.menu) {
                    Object.keys(MENU).forEach(key => {
                        const live = data.menu[key];
                        if (!live) return;
                        ['price', 'oldPrice', 'discount', 'name', 'shortName'].forEach(field => {
                            if (live[field] !== undefined) MENU[key][field] = live[field];
                        });
                        MENU[key].available = live.available !== false;
                    });
                }
            } catch (e) { }
            renderDish();
        })();
    }

    async function shareDish() {
        if (!currentDishData) return;
        const url = window.location.href;
        const title = `Try ${currentDishData.name} at Aapla Swad!`;
        const text = `I found this amazing ${currentDishData.name} for just ₹${currentDishData.price}. Order now from Aapla Swad!`;
        
        if (navigator.share) {
            try {
                await navigator.share({ title, text, url });
            } catch (err) {
                console.log('Error sharing:', err);
            }
        } else {
            navigator.clipboard.writeText(`${title} - ${url}`);
            const btn = document.querySelector('.share-btn');
            const oldHTML = btn.innerHTML;
            btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
            setTimeout(() => { btn.innerHTML = oldHTML; }, 2000);
        }
    }

    function renderDish() {
        const isVeg = dish.category === 'veg';
        const hotelName = dish.hotel || (isVeg ? 'Aapla Swad Hotel' : 'Maratha Hotel');
        const hotelSubMap = { 'Aapla Swad Hotel': 'Pure Veg • Home-style Cooking', 'Maratha Hotel': 'Non-Veg Speciality • Maharashtrian', 'Shriyan Chinese': 'Indo-Chinese • Veg', 'Mauli Veg Rol': 'Veg Rolls • 2 pcs each' };
        const hotelSub = hotelSubMap[hotelName] || (isVeg ? 'Pure Veg' : 'Non-Veg Speciality');

        document.title = hotelName + ' — ' + dish.name;
        document.getElementById('navTitle').textContent = dish.shortName;
        document.getElementById('dishHero').src = dish.image;
        document.getElementById('dishHero').alt = dish.name;

        // Hotel Badge
        document.getElementById('hotelBadge').innerHTML = `
            <img src="logo.png" alt="${hotelName}" class="hotel-badge-icon">
            <div>
                <div class="hotel-badge-name">${hotelName}</div>
                <div class="hotel-badge-sub">${hotelSub}</div>
            </div>
            <span class="hotel-badge-type ${isVeg ? 'veg' : 'nonveg'}">${isVeg ? '● VEG' : '● NON-VEG'}</span>
        `;

        // Tags
        let tagsHTML = `<span class="${isVeg ? 'tag-veg' : 'tag-nonveg'}">${isVeg ? '● VEG' : '● NON-VEG'}</span>`;
        tagsHTML += `<span class="tag-rating">⭐ ${isVeg ? '4.9' : '4.8'} (${Math.floor(Math.random()*500+200)} reviews)</span>`;
        if (itemKey !== 'dal-bati') tagsHTML += '<span class="tag-new">NEW</span>';
        document.getElementById('dishTags').innerHTML = tagsHTML;

        // Title
        document.getElementById('dishTitle').textContent = dish.name;
        document.getElementById('dishSubtitle').textContent = isVeg
            ? 'Aapla Swad Hotel • Authentic home-style cooking • Served hot & fresh'
            : 'Maratha Hotel • Maharashtrian non-veg speciality • Served hot & fresh';

        // Price
        document.getElementById('pOld').textContent = '₹' + dish.oldPrice;
        document.getElementById('pNow').textContent = '₹' + dish.price;
        document.getElementById('pOff').textContent = dish.discount;
        document.getElementById('obPrice').textContent = '₹' + dish.price;
        document.getElementById('obOldPrice').textContent = '₹' + dish.oldPrice;

        // Includes
        let incHTML = '';
        dish.includesList.forEach(inc => {
            incHTML += `
            <div class="include-item">
                <span class="include-emoji">${inc.emoji}</span>
                <div>
                    <div class="include-text">${inc.name}</div>
                    <div class="include-sub">${inc.desc}</div>
                </div>
            </div>`;
        });
        document.getElementById('includesCard').innerHTML = incHTML;

        // Reviews Carousel
        let carouselHTML = '';
        let dotsHTML = '';
        dish.reviews.forEach((rev, i) => {
            const initials = rev.name.split(' ').map(w => w[0]).join('');
            carouselHTML += `
            <div class="review-slide">
                <div class="review-card">
                    <div class="review-header">
                        <div class="review-avatar">${initials}</div>
                        <div>
                            <span class="review-name">${rev.name}</span>
                            <div class="review-date">${rev.date}</div>
                        </div>
                    </div>
                    <div class="review-stars">${'⭐'.repeat(rev.stars)}</div>
                    <div class="review-text">"${rev.text}"</div>
                </div>
            </div>`;
            dotsHTML += `<div class="review-dot ${i === 0 ? 'active' : ''}" onclick="goToReview(${i})"></div>`;
        });
        document.getElementById('reviewCarousel').innerHTML = carouselHTML;
        document.getElementById('reviewDots').innerHTML = dotsHTML;

        // Start auto-rotation
        startReviewCarousel();
    }

    // --- Review Carousel Logic ---
    function goToReview(index) {
        const carousel = document.getElementById('reviewCarousel');
        const dots = document.querySelectorAll('.review-dot');
        const total = dish.reviews.length;
        currentReview = index % total;
        carousel.style.transform = `translateX(-${currentReview * 100}%)`;
        dots.forEach((d, i) => d.classList.toggle('active', i === currentReview));
    }

    function startReviewCarousel() {
        if (reviewInterval) clearInterval(reviewInterval);
        reviewInterval = setInterval(() => {
            goToReview(currentReview + 1);
        }, 3500);
    }

    // Pause on touch
    // Prices and availability come from the admin panel. The descriptions and
    // reviews above are page content the API does not hold, so only the live
    // fields are overlaid onto them.
    async function applyLivePricing() {
        try {
            const res = await fetch('https://f37z1y2xbg.execute-api.ap-south-1.amazonaws.com/menu');
            const data = await res.json();
            if (!data || !data.success || !data.menu) return;

            let changed = false;
            Object.keys(MENU).forEach(key => {
                const live = data.menu[key];
                if (!live) return;
                ['price', 'oldPrice', 'discount', 'name', 'shortName'].forEach(field => {
                    if (live[field] !== undefined && live[field] !== MENU[key][field]) {
                        MENU[key][field] = live[field];
                        changed = true;
                    }
                });
                MENU[key].available = live.available !== false;
                if (live.available === false) changed = true;
            });

            if (changed) renderDish();
        } catch (err) {
            // Offline: the built-in prices stay on screen, and the order page
            // re-checks against the server before anything is charged.
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        applyLivePricing();

        const wrap = document.querySelector('.review-carousel-wrap');
        if (wrap) {
            wrap.addEventListener('touchstart', () => { if (reviewInterval) clearInterval(reviewInterval); });
            wrap.addEventListener('touchend', () => { startReviewCarousel(); });
        }
    });

    // --- Cart (localStorage-based) ---

    function addToCartAndSuggest() {
        // Check if shop is closed before adding to cart
        if (!isShopOpen()) {
            // Re-fetch in background for next check, but show overlay immediately
            fetchShopStatus();
            showClosedOverlay();
            return;
        }

        // Check if this is a Chinese item and Chinese hours are closed (3 PM - 10 PM)
        if (dish.hotel === 'Shriyan Chinese' && !isChineseOpenLocal()) {
            showClosedOverlay(
                '🥡 Shriyan Chinese is available only from 3:00 PM to 10:00 PM. Please come back later!',
                '🕐 Opens at 3:00 PM'
            );
            return;
        }

        // Check if this is a Rolls item and Rolls hours are closed (5 PM - 10 PM)
        if (dish.hotel === 'Mauli Veg Rol' && !isRollsOpenLocal()) {
            showClosedOverlay(
                '🌯 Mauli Veg Rol is available only from 5:00 PM to 10:00 PM. Please come back later!',
                '🕐 Opens at 5:00 PM'
            );
            return;
        }

        // Add current item to pre-cart
        preCart[itemKey] = (preCart[itemKey] || 0) + 1;
        localStorage.setItem('sp_precart', JSON.stringify(preCart));

        // Show confirmation
        const isVeg = dish.category === 'veg';
        document.getElementById('addedConfirm').innerHTML = `
            <div class="added-check">✅</div>
            <div class="added-info">
                <div class="added-name">${dish.shortName} added to cart!</div>
                <div class="added-sub">₹${dish.price} × ${preCart[itemKey]} = ₹${dish.price * preCart[itemKey]}</div>
            </div>
        `;

        // Build suggestions (other items not yet in cart)
        const sugScroll = document.getElementById('sugScroll');
        let sugHTML = '';
        Object.keys(MENU).forEach(key => {
            if (key === itemKey) return; // skip current item
            const m = MENU[key];
            const inCart = (preCart[key] || 0) > 0;
            sugHTML += `
            <div class="sug-card ${inCart ? 'in-cart' : ''}" id="sug-card-${key}">
                <img src="${m.image}" alt="${m.shortName}" class="sug-img">
                <div class="sug-body">
                    <div class="sug-name">${m.shortName}</div>
                    <div class="sug-desc">${m.includesList.map(i => i.name).slice(0,2).join(' • ')}</div>
                    <div class="sug-price-row">
                        <span class="sug-price">₹${m.price}</span>
                        <span class="sug-old">₹${m.oldPrice}</span>
                    </div>
                    <button class="sug-add-btn ${inCart ? 'added' : ''}" id="sug-btn-${key}" onclick="addSuggestion('${key}')">
                        ${inCart ? '✓ Added' : '+ ADD'}
                    </button>
                </div>
            </div>`;
        });
        sugScroll.innerHTML = sugHTML;

        // Update cart summary
        updateCartSummary();

        // Change bottom bar button
        const obBtn = document.getElementById('obBtn');
        obBtn.innerHTML = '✓ Added — View Cart';
        obBtn.onclick = goToCart;
        obBtn.style.background = 'linear-gradient(135deg, #16a34a, #15803d)';

        // Show sheet
        document.getElementById('bsOverlay').classList.add('show');
        document.getElementById('bsSheet').classList.add('show');
    }

    function addSuggestion(key) {
        preCart[key] = (preCart[key] || 0) + 1;
        localStorage.setItem('sp_precart', JSON.stringify(preCart));

        // Update button
        const btn = document.getElementById('sug-btn-' + key);
        btn.textContent = '✓ Added';
        btn.classList.add('added');
        const card = document.getElementById('sug-card-' + key);
        card.classList.add('in-cart');

        // Quick animation
        card.style.transform = 'scale(0.95)';
        setTimeout(() => { card.style.transform = 'scale(1)'; }, 150);

        updateCartSummary();
    }

    function updateCartSummary() {
        let totalItems = 0;
        let totalPrice = 0;
        Object.keys(preCart).forEach(key => {
            if (preCart[key] > 0 && MENU[key]) {
                totalItems += preCart[key];
                totalPrice += preCart[key] * MENU[key].price;
            }
        });

        const itemNames = Object.keys(preCart)
            .filter(k => preCart[k] > 0 && MENU[k])
            .map(k => `${MENU[k].shortName} ×${preCart[k]}`)
            .join(', ');

        document.getElementById('bsCartSummary').innerHTML = `
            <div>
                <div class="bs-cart-count">🛒 ${totalItems} item${totalItems > 1 ? 's' : ''}</div>
                <div style="font-size:0.52rem;color:#888;">${itemNames}</div>
            </div>
            <span class="bs-cart-total">₹${totalPrice}</span>
        `;
    }

    function closeSuggestions() {
        document.getElementById('bsOverlay').classList.remove('show');
        document.getElementById('bsSheet').classList.remove('show');
    }

    function goToCart() {
        localStorage.setItem('sp_precart', JSON.stringify(preCart));
        window.location.href = 'order.html';
    }
    </script>
</body>
</html>
