<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Delivery — Aapla Swad</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --orange:#ea580c; --gold:#f59e0b; --dark:#111111; --card:#1a1a1a; --border:rgba(255,255,255,0.06); --green:#22c55e; --red:#ef4444; --blue:#3b82f6; --purple:#8b5cf6; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Manrope',sans-serif; background:var(--dark); color:#fafafa; height:100dvh; overflow:hidden; -webkit-user-select:none; user-select:none; }
        .app { max-width:480px; margin:0 auto; height:100dvh; display:flex; flex-direction:column; position:relative; }

        /* LOGIN */
        .login-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100dvh; padding:2rem; background:var(--dark); }
        .login-screen img { width:64px; height:64px; border-radius:50%; margin-bottom:1rem; border:2px solid var(--gold); }
        .login-screen h2 { font-size:1.3rem; color:var(--gold); margin-bottom:0.25rem; font-weight:800; }
        .login-screen p { font-size:0.75rem; color:#666; margin-bottom:1.5rem; }
        .login-field { width:100%; max-width:300px; margin-bottom:0.75rem; }
        .login-field label { display:block; font-size:0.72rem; color:#999; margin-bottom:0.3rem; font-weight:500; }
        .login-field input { width:100%; padding:0.75rem; background:var(--card); border:1px solid var(--border); border-radius:12px; color:#fafafa; font-size:0.95rem; font-family:inherit; }
        .login-field input:focus { outline:none; border-color:var(--orange); }
        .login-btn { width:100%; max-width:300px; padding:0.85rem; background:linear-gradient(135deg,var(--orange),var(--gold)); color:white; border:none; border-radius:14px; font-size:1rem; font-weight:700; cursor:pointer; font-family:inherit; margin-top:0.5rem; }
        .login-hint { font-size:0.6rem; color:#444; margin-top:1rem; }

        /* TOPBAR */
        .topbar { flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0.6rem 0.75rem; background:rgba(12,12,12,0.95); border-bottom:1px solid var(--border); z-index:10; }
        .topbar-left { display:flex; align-items:center; gap:0.4rem; }
        .topbar-left img { width:28px; height:28px; border-radius:50%; }
        .topbar-left .tb-info h1 { font-size:0.85rem; font-weight:700; color:var(--gold); line-height:1; }
        .topbar-left .tb-info span { font-size:0.58rem; color:#888; }
        .status-toggle { display:flex; align-items:center; gap:0.3rem; padding:0.3rem 0.6rem; border-radius:20px; font-size:0.68rem; font-weight:600; border:none; cursor:pointer; font-family:inherit; }
        .status-toggle.online { background:rgba(34,197,94,0.15); color:var(--green); }
        .status-toggle.offline { background:rgba(239,68,68,0.15); color:var(--red); }

        /* MAP */
        .map-area { flex:1; position:relative; min-height:0; background:#111; }
        .map-area iframe { width:100%; height:100%; border:0; }
        .map-placeholder { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:#555; }
        .map-placeholder .mp-icon { font-size:3rem; margin-bottom:0.5rem; }
        .map-placeholder p { font-size:0.78rem; }

        /* NAV FLOAT */
        .nav-float { position:absolute; bottom:0.75rem; left:0.75rem; right:0.75rem; z-index:20; display:none; }
        .nav-float.show { display:block; animation:slideUp 0.3s; }
        @keyframes slideUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .nav-info { background:rgba(12,12,12,0.92); backdrop-filter:blur(12px); border:1px solid var(--border); border-radius:14px; padding:0.65rem 0.85rem; margin-bottom:0.4rem; }
        .nav-dest { font-size:0.72rem; font-weight:600; color:var(--gold); margin-bottom:0.3rem; }
        .nav-addr { font-size:0.65rem; color:#888; line-height:1.3; margin-bottom:0.15rem; }
        .nav-lmk { font-size:0.65rem; color:var(--gold); }
        .nav-google-btn { display:block; width:100%; padding:0.75rem; background:linear-gradient(135deg,#4285F4,#34A853); border:none; border-radius:14px; color:white; font-size:0.9rem; font-weight:700; cursor:pointer; font-family:inherit; text-align:center; text-decoration:none; letter-spacing:0.3px; box-shadow:0 4px 15px rgba(66,133,244,0.3); }

        /* BOTTOM PANEL */
        .bottom-panel { flex-shrink:0; background:var(--dark); border-top:1px solid var(--border); max-height:45dvh; overflow:hidden; transition:max-height 0.3s; }
        .bottom-panel.collapsed { max-height:55px; }
        .bp-handle { width:40px; height:4px; background:#444; border-radius:2px; margin:0.4rem auto 0; cursor:pointer; }
        .bp-header { display:flex; justify-content:space-between; align-items:center; padding:0.35rem 0.85rem 0.3rem; cursor:pointer; }
        .bp-header h2 { font-size:0.82rem; font-weight:700; }
        .bp-count { background:var(--orange); color:white; font-size:0.58rem; font-weight:700; padding:0.1rem 0.4rem; border-radius:10px; }
        .bp-scroll { overflow-y:auto; max-height:calc(45dvh - 55px); padding:0 0.5rem 0.5rem; }
        .bp-loading { text-align:center; padding:1rem; color:#666; font-size:0.72rem; }

        /* ORDER CARDS */
        .o-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:0.7rem; margin-bottom:0.4rem; cursor:pointer; transition:border-color 0.15s; }
        .o-card:active { border-color:var(--orange); }
        .o-card.selected { border-color:var(--orange); box-shadow:0 0 0 1px var(--orange); }
        .oc-row1 { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.35rem; }
        .oc-id { font-size:0.7rem; font-weight:700; color:var(--gold); }
        .oc-time { font-size:0.58rem; color:#555; }
        .oc-badge { font-size:0.56rem; font-weight:600; padding:0.1rem 0.4rem; border-radius:6px; }
        .oc-badge.new { background:rgba(245,158,11,0.15); color:var(--gold); }
        .oc-badge.accepted { background:rgba(59,130,246,0.15); color:var(--blue); }
        .oc-badge.picked { background:rgba(139,92,246,0.15); color:var(--purple); }
        .oc-name { font-size:0.8rem; font-weight:600; margin-bottom:0.1rem; }
        .oc-addr { font-size:0.66rem; color:#888; line-height:1.3; }
        .oc-lmk { font-size:0.64rem; color:var(--gold); margin-top:0.1rem; }
        .oc-meta { display:flex; gap:0.4rem; align-items:center; font-size:0.66rem; color:#777; margin-top:0.35rem; }
        .oc-price { font-size:0.85rem; font-weight:700; color:var(--green); }
        .oc-pay-tag { font-size:0.52rem; padding:0.06rem 0.3rem; border-radius:4px; }
        .oc-pay-tag.cod { background:rgba(245,158,11,0.15); color:var(--gold); }
        .oc-pay-tag.paid { background:rgba(34,197,94,0.15); color:var(--green); }
        .oc-btns { display:flex; gap:0.3rem; margin-top:0.45rem; }
        .oc-btn { flex:1; padding:0.45rem; border:none; border-radius:10px; font-size:0.7rem; font-weight:600; cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:0.2rem; }
        .oc-btn:active { transform:scale(0.96); }
        .btn-accept { background:var(--green); color:white; }
        .btn-pickup { background:var(--blue); color:white; }
        .btn-deliver { background:var(--orange); color:white; }
        .btn-call { background:rgba(34,197,94,0.1); color:var(--green); border:1px solid rgba(34,197,94,0.2); }
        .empty { text-align:center; padding:1.5rem; }
        .empty-icon { font-size:2rem; margin-bottom:0.3rem; }
        .empty h3 { font-size:0.78rem; color:#555; font-weight:500; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div class="login-screen" id="loginScreen">
        <img src="logo.png" alt="Aapla Swad">
        <h2>🛵 Delivery Partner</h2>
        <p>Login to start accepting deliveries</p>
        <div class="login-field">
            <label>Phone Number</label>
            <input type="tel" id="login-phone" placeholder="10-digit number" maxlength="10">
        </div>
        <div class="login-field">
            <label>PIN</label>
            <input type="password" id="login-pin" placeholder="4-digit PIN" maxlength="4">
        </div>
        <button class="login-btn" onclick="deliveryLogin()">Start Delivering →</button>
        <p class="login-hint">Demo: Phone 9999999999, PIN 1234</p>
    </div>

    <!-- MAIN APP -->
    <div class="app" id="mainApp" style="display:none;">
        <div class="topbar">
            <div class="topbar-left">
                <img src="logo.png" alt="">
                <div class="tb-info">
                    <h1>Aapla Swad</h1>
                    <span id="partner-name">Delivery Partner</span>
                </div>
            </div>
            <button class="status-toggle online" id="statusBtn" onclick="toggleStatus()">
                🟢 <span id="status-text">Online</span>
            </button>
        </div>

        <div class="map-area" id="mapArea">
            <div class="map-placeholder" id="mapPlaceholder">
                <div class="mp-icon">🗺️</div>
                <p>Tap an order to see pickup & drop route</p>
            </div>
            <iframe id="gmap" style="display:none;" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            <div class="nav-float" id="navFloat">
                <div class="nav-info">
                    <div class="nav-dest" id="navDest"></div>
                    <div class="nav-addr" id="navAddr"></div>
                    <div class="nav-lmk" id="navLmk"></div>
                </div>
                <a class="nav-google-btn" id="navBtn" href="#" target="_blank">🗺️ Start Google Maps Navigation</a>
            </div>
        </div>

        <div class="bottom-panel" id="bottomPanel">
            <div class="bp-handle" onclick="togglePanel()"></div>
            <div class="bp-header" onclick="togglePanel()">
                <h2>📦 Orders</h2>
                <span class="bp-count" id="orderCount">0</span>
            </div>
            <div class="bp-scroll" id="orderList">
                <div class="bp-loading">Loading orders...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://f37z1y2xbg.execute-api.ap-south-1.amazonaws.com';
        const PICKUP = { lat: 19.8762, lng: 75.3433 };
        let isOnline = true, panelCollapsed = false, selectedOrderId = null;
        let ordersCache = [];

        function deliveryLogin() {
            const phone = document.getElementById('login-phone').value.trim();
            const pin = document.getElementById('login-pin').value.trim();
            if (!phone || phone.length !== 10) { alert('Enter valid 10-digit phone'); return; }
            if (pin !== '1234') { alert('Invalid PIN. Demo PIN: 1234'); return; }
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
            document.getElementById('partner-name').textContent = 'Driver #' + phone.slice(-4);
            fetchOrders();
        }

        // === FETCH ORDERS FROM AWS ===
        async function fetchOrders() {
            try {
                const res = await fetch(API_URL + '/orders');
                const data = await res.json();
                if (data.success) {
                    ordersCache = data.orders.filter(o => o.status !== 'delivered');
                    renderOrderCards();
                }
            } catch (err) {
                console.error('Fetch error:', err);
            }
        }

        // === UPDATE ORDER STATUS VIA AWS ===
        async function updateOrder(orderId, newStatus) {
            try {
                const res = await fetch(API_URL + '/orders/' + encodeURIComponent(orderId), {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                const data = await res.json();
                if (data.success) {
                    if (newStatus === 'delivered') {
                        selectedOrderId = null;
                        document.getElementById('navFloat').classList.remove('show');
                        document.getElementById('gmap').style.display = 'none';
                        document.getElementById('mapPlaceholder').style.display = 'flex';
                        expandPanel();
                        alert('✅ Order delivered successfully!');
                    }
                    if (newStatus === 'accepted') {
                        const order = ordersCache.find(o => o.orderId === orderId);
                        if (order && order.lat && order.lng) showRoute(order);
                    }
                    fetchOrders();
                }
            } catch (err) {
                alert('Update failed: ' + err.message);
            }
        }

        function showRoute(order) {
            if (!order.lat || !order.lng) { alert('Customer location not available'); return; }
            selectedOrderId = order.orderId;

            const routeEmbed = `https://maps.google.com/maps?saddr=${PICKUP.lat},${PICKUP.lng}&daddr=${order.lat},${order.lng}&output=embed`;
            const iframe = document.getElementById('gmap');
            iframe.src = routeEmbed;
            iframe.style.display = 'block';
            document.getElementById('mapPlaceholder').style.display = 'none';

            document.getElementById('navDest').textContent = '📍 Drop: ' + order.customerName;
            document.getElementById('navAddr').textContent = order.address;
            document.getElementById('navLmk').textContent = order.landmark ? '📌 ' + order.landmark : '';

            const navUrl = `https://www.google.com/maps/dir/?api=1&origin=${PICKUP.lat},${PICKUP.lng}&destination=${order.lat},${order.lng}&travelmode=driving`;
            document.getElementById('navBtn').href = navUrl;
            document.getElementById('navFloat').classList.add('show');
            collapsePanel();
            renderOrderCards();
        }

        function renderOrderCards() {
            const active = ordersCache;
            document.getElementById('orderCount').textContent = active.length;
            const list = document.getElementById('orderList');

            if (active.length === 0) {
                list.innerHTML = '<div class="empty"><div class="empty-icon">🛵</div><h3>Waiting for orders...</h3></div>';
                return;
            }

            list.innerHTML = active.map(o => {
                const time = new Date(o.createdAt).toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
                const statusLabels = { pending:'New Order', accepted:'Accepted', picked_up:'On the Way' };
                const statusClasses = { pending:'new', accepted:'accepted', picked_up:'picked' };
                const payTag = o.paymentMethod === 'cod'
                    ? '<span class="oc-pay-tag cod">COD — Collect ₹' + o.total + '</span>'
                    : '<span class="oc-pay-tag paid">PAID ✅</span>';
                const isSelected = o.orderId === selectedOrderId;

                let btns = '';
                if (o.status === 'pending') {
                    btns = `<button class="oc-btn btn-accept" onclick="event.stopPropagation();updateOrder('${o.orderId}','accepted')">✅ Accept Order</button>`;
                } else if (o.status === 'accepted') {
                    btns = `
                        <button class="oc-btn btn-call" onclick="event.stopPropagation();window.location.href='tel:${o.phone}'">📞 Call</button>
                        <button class="oc-btn btn-pickup" onclick="event.stopPropagation();updateOrder('${o.orderId}','picked_up')">📦 Picked Up</button>`;
                } else if (o.status === 'picked_up') {
                    btns = `
                        <button class="oc-btn btn-call" onclick="event.stopPropagation();window.location.href='tel:${o.phone}'">📞 Call</button>
                        <button class="oc-btn btn-deliver" onclick="event.stopPropagation();updateOrder('${o.orderId}','delivered')">✅ Delivered</button>`;
                }

                return `
                <div class="o-card ${isSelected ? 'selected' : ''}" onclick="showRoute(ordersCache.find(x=>x.orderId==='${o.orderId}'))">
                    <div class="oc-row1">
                        <span class="oc-id">${o.orderId} <span class="oc-time">• ${time}</span></span>
                        <span class="oc-badge ${statusClasses[o.status] || 'new'}">${statusLabels[o.status] || o.status}</span>
                    </div>
                    <div class="oc-name">${o.customerName}</div>
                    <div class="oc-addr">${o.address}</div>
                    ${o.landmark ? `<div class="oc-lmk">📌 ${o.landmark}</div>` : ''}
                    <div class="oc-meta">
                        <span>x${o.qty} Dal Bati</span> •
                        <span class="oc-price">₹${o.total}</span>
                        ${payTag}
                    </div>
                    <div class="oc-btns">${btns}</div>
                </div>`;
            }).join('');
        }

        function togglePanel() { panelCollapsed = !panelCollapsed; document.getElementById('bottomPanel').classList.toggle('collapsed', panelCollapsed); }
        function collapsePanel() { panelCollapsed = true; document.getElementById('bottomPanel').classList.add('collapsed'); }
        function expandPanel() { panelCollapsed = false; document.getElementById('bottomPanel').classList.remove('collapsed'); }
        function toggleStatus() {
            isOnline = !isOnline;
            const btn = document.getElementById('statusBtn');
            btn.innerHTML = (isOnline ? '🟢' : '🔴') + ' <span id="status-text">' + (isOnline ? 'Online' : 'Offline') + '</span>';
            btn.className = 'status-toggle ' + (isOnline ? 'online' : 'offline');
        }

        // Auto-refresh from AWS every 8 seconds
        setInterval(() => {
            if (document.getElementById('mainApp').style.display !== 'none') fetchOrders();
        }, 8000);
    </script>
</body>
</html>
