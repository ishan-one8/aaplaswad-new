<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Aapla Swad</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css?v=1">
    <style>
        body {
            display: flex; align-items: center; justify-content: center;
            min-height: 100dvh; padding: 24px;
            background: radial-gradient(90% 60% at 50% 0%, var(--brand-soft), transparent 70%), var(--bg);
        }
        .container {
            width: 100%; max-width: 400px; padding: 32px 24px; text-align: center;
            border-radius: 30px; background: var(--surface); border: 1px solid var(--line);
            box-shadow: var(--shadow-lg); animation: rise 0.6s var(--ease-out);
        }
        .logo { width: 84px; height: 84px; border-radius: 26px; margin: 0 auto 14px; object-fit: cover; box-shadow: 0 0 0 4px var(--surface), 0 0 0 6px var(--brand-line), var(--shadow-md); animation: pop 0.7s var(--ease-spring) both; }
        h1 { font-family: var(--font-display); font-size: 1.5rem; font-weight: 900; letter-spacing: -0.02em; background: var(--grad-brand); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .amount { font-family: var(--font-display); font-size: 2.7rem; font-weight: 900; letter-spacing: -0.02em; margin: 14px 0 6px; color: var(--text); }
        .status { font-size: 0.9rem; color: var(--text-2); margin-bottom: 22px; }
        .btn {
            position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center;
            width: 100%; height: 54px; border: 0; border-radius: 16px;
            background: var(--grad-brand); color: #fff; font-size: 1rem; font-weight: 800;
            box-shadow: var(--shadow-brand); cursor: pointer;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .success { color: var(--ok); }
        .error { color: var(--danger); }
        .back-link { display: block; margin-top: 18px; color: var(--brand-ink); font-size: 0.86rem; font-weight: 700; }
        .pay-warn { width: 52px; height: 52px; color: var(--warn); }
        .pay-done { width: 84px; height: 84px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-2); color: #fff; box-shadow: 0 14px 34px rgba(22, 163, 74, 0.35); animation: pop 0.7s var(--ease-spring); }
        .pay-done .ic { width: 44px; height: 44px; stroke-width: 3; }
    </style>
    <script src="theme.js?v=1"></script>
    <script src="i18n.js"></script>
</head>
<body>
    <div class="container">
        <img src="icon-192.png" alt="Aapla Swad" class="logo">
        <h1>Aapla Swad</h1>
        <div class="amount" id="pay-amount">Loading...</div>
        <div class="status" id="pay-status">Preparing payment...</div>
        <button class="btn" id="pay-btn" disabled onclick="openRazorpay()">Pay Now</button>
        <a href="javascript:window.close()" class="back-link" id="back-link" style="display:none;">← Return to App</a>
    </div>

    <script>
        // Read payment params from URL
        const params = new URLSearchParams(window.location.search);
        const key = params.get('key');
        const orderId = params.get('order_id');
        const amount = parseInt(params.get('amount') || '0');
        const name = params.get('name') || '';
        const contact = params.get('contact') || '';
        const email = params.get('email') || '';
        const description = params.get('desc') || 'Food Order';
        const apiUrl = params.get('api') || '';

        const amountEl = document.getElementById('pay-amount');
        const statusEl = document.getElementById('pay-status');
        const payBtn = document.getElementById('pay-btn');
        const backLink = document.getElementById('back-link');

        if (!key || !orderId || !amount) {
            amountEl.innerHTML = '<i class="ic pay-warn" data-ic="alert"></i>';
            statusEl.textContent = 'Invalid payment link. Please go back and try again.';
            statusEl.className = 'status error';
        } else {
            amountEl.textContent = '₹' + (amount / 100);
            statusEl.textContent = 'Tap Pay Now to complete';
            payBtn.disabled = false;

            // Auto-open Razorpay after a short delay
            setTimeout(() => openRazorpay(), 500);
        }

        function openRazorpay() {
            payBtn.disabled = true;
            statusEl.textContent = 'Opening payment...';

            const options = {
                key: key,
                order_id: orderId,
                amount: amount,
                currency: 'INR',
                name: 'Aapla Swad',
                description: description,
                image: 'icon-192.png',
                handler: function(response) {
                    // Tell the server to complete the order immediately.
                    // The backend's claimPayment() conditional write prevents
                    // double order creation even if the webhook also fires.
                    if (apiUrl) {
                        fetch(apiUrl + '/payment/complete', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ razorpayOrderId: response.razorpay_order_id })
                        }).catch(function() {});
                    }

                    // Store payment info
                    try {
                        localStorage.setItem('sp_payment_done', JSON.stringify({
                            razorpayOrderId: response.razorpay_order_id,
                            razorpayPaymentId: response.razorpay_payment_id,
                            at: Date.now()
                        }));
                    } catch(e) {}

                    // Show success UI — tell user to go back to app
                    document.querySelector('.container').innerHTML = 
                        '<div style="text-align:center;padding:2rem 1rem;">' +
                            '<div class="pay-done"><i class="ic" data-ic="check"></i></div>' +
                            '<h1 style="font-size:1.5rem;color:var(--ok);-webkit-text-fill-color:var(--ok);background:none;margin-bottom:0.5rem;">Payment Successful!</h1>' +
                            '<p style="color:var(--text-2);font-size:0.9rem;margin-bottom:1.5rem;">Your payment of <strong style="color:var(--brand-ink);">₹' + (amount/100) + '</strong> has been received.</p>' +
                            '<div style="padding:1.2rem;background:rgba(34,197,94,0.1);border:1.5px solid rgba(34,197,94,0.3);border-radius:14px;margin-bottom:1rem;">' +
                                '<p style="color:var(--ok);font-size:1rem;font-weight:700;margin:0;">Go back to the Aapla Swad app</p>' +
                                '<p style="color:var(--text-2);font-size:0.8rem;margin:0.5rem 0 0;">Your order will be confirmed automatically.</p>' +
                            '</div>' +
                            '<p style="color:var(--text-3);font-size:0.75rem;">You can close this tab now.</p>' +
                        '</div>';
                },
                prefill: { name: name, contact: contact, email: email },
                config: {
                    display: {
                        blocks: {
                            upi: {
                                name: 'Pay using UPI',
                                instruments: [
                                    { method: 'upi', flows: ['intent'], apps: ['google_pay'] },
                                    { method: 'upi', flows: ['intent'], apps: ['phonepe'] },
                                    { method: 'upi', flows: ['collect'] },
                                    { method: 'upi', flows: ['qr'] },
                                ]
                            }
                        },
                        sequence: ['block.upi'],
                        preferences: { show_default_blocks: true }
                    }
                },
                theme: { color: '#e8590c' },
                modal: {
                    ondismiss: function() {
                        payBtn.disabled = false;
                        statusEl.textContent = 'Payment cancelled. Tap to retry.';
                    }
                }
            };

            try {
                const rzp = new Razorpay(options);
                rzp.on('payment.failed', function(response) {
                    payBtn.disabled = false;
                    statusEl.innerHTML = '<span class="error">Payment failed: ' + response.error.description + '</span>';
                });
                rzp.open();
            } catch(e) {
                statusEl.innerHTML = '<span class="error">Could not open payment: ' + e.message + '</span>';
                payBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
